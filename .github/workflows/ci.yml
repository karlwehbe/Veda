# Runs the server's test suite on every push and PR, so broken code gets caught
# before it lands on main. Checks out the repo, installs Python + the server
# package (with dev extras), then runs pytest. No deploy step lives here; add
# one back if/when a hosting target is chosen.
name: ci

# Run on every push to any branch and on every pull request.
on:
  push:
    branches: ["**"]
  pull_request:

# Cancel an older in-progress run for the same branch/PR when a new commit lands,
# so we don't waste CI minutes testing stale code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    # Run all shell steps below from server/, so commands don't need "cd server" each time.
    defaults:
      run:
        working-directory: server
    # The models use JSONB and the postgresql UUID type, so SQLite cannot
    # stand in — the integration layer needs a real Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # conftest.py creates ai_note_taker_test on demand; it refuses to run
      # against any database whose name doesn't contain "test".
      DATABASE_URL_TEST: postgresql+psycopg://postgres:postgres@localhost:5432/ai_note_taker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pip downloads, keyed off pyproject.toml so cache invalidates when deps change.
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install dependencies
        # Editable install of the server package plus the "dev" extras (pytest, pytest-asyncio).
        run: pip install -e ".[dev]"
      - name: Unit and integration tests
        # The system layer is excluded: it needs the compose stack, which is
        # covered by the acceptance job below. It skips itself if run here.
        run: pytest tests/unit tests/integration -q

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Start the stack with a stubbed model
        run: |
          set -euo pipefail
          # Only the stubbed test API (8001) — not the dev api on 8000.
          docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build db

          # A fresh Postgres container starts a temporary server to run its init
          # scripts, shuts it down, then starts the real one. pg_isready can succeed
          # against the temporary server, so wait for a real query to work instead.
          for attempt in {1..60}; do
            if docker compose ps --status running --services | grep -qx db \
              && docker compose exec -T db pg_isready -U postgres -d postgres >/dev/null 2>&1 \
              && docker compose exec -T db psql -U postgres -d postgres -v ON_ERROR_STOP=1 -Atqc "SELECT 1" >/dev/null 2>&1
            then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "PostgreSQL did not become stable"
              docker compose logs db
              exit 1
            fi
            sleep 2
          done

          # CREATE DATABASE via a plain SQL check. \gexec is a psql meta-command
          # and is rejected when passed to psql -c (as happened in CI).
          if ! docker compose exec -T db psql -U postgres -d postgres -Atqc \
            "SELECT 1 FROM pg_database WHERE datname = 'ai_note_taker_system'" | grep -qx 1
          then
            docker compose exec -T db psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c "CREATE DATABASE ai_note_taker_system"
          fi

          docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build llm-stub api-test
          for attempt in {1..90}; do
            curl -sf http://localhost:8001/health && break
            if [ "$attempt" -eq 90 ]; then
              echo "The test API did not become healthy"
              docker compose -f docker-compose.yml -f docker-compose.test.yml logs api-test llm-stub
              exit 1
            fi
            sleep 1
          done
      - name: System tests
        working-directory: server
        run: |
          pip install -e ".[dev]"
          pytest tests/system -q
      - name: Acceptance tests
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: client/test-results/
          retention-days: 7
